<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 290" role="img" aria-labelledby="title desc"><title id="title">Retail Sales ETL Pipeline</title><desc id="desc">CSV file is extracted by Python Pandas, validated and cleaned, loaded into PostgreSQL, and analyzed using SQL. Invalid rows go to a rejected CSV.</desc><rect width="1040" height="290" rx="20" fill="#f8fafc"/><text x="520" y="38" font-family="Arial,sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#0f172a">Retail Sales ETL — How Data Moves</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="35" y="83" width="190" height="100" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="130" y="123" font-size="20" font-weight="bold" fill="#1e3a8a">1. EXTRACT</text><text x="130" y="150" font-size="16" fill="#1e40af">CSV orders</text><rect x="295" y="83" width="190" height="100" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="390" y="123" font-size="20" font-weight="bold" fill="#92400e">2. TRANSFORM</text><text x="390" y="150" font-size="16" fill="#92400e">Python + Pandas</text><rect x="555" y="83" width="190" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="650" y="123" font-size="20" font-weight="bold" fill="#166534">3. LOAD</text><text x="650" y="150" font-size="16" fill="#166534">PostgreSQL</text><rect x="815" y="83" width="190" height="100" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="910" y="123" font-size="20" font-weight="bold" fill="#5b21b6">4. ANALYZE</text><text x="910" y="150" font-size="16" fill="#5b21b6">SQL reports</text><rect x="310" y="219" width="160" height="49" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="390" y="248" font-size="15" fill="#991b1b">Rejected rows CSV</text></g><g stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M225 133h62m-9 -8 9 8 -9 8"/><path d="M485 133h62m-9 -8 9 8 -9 8"/><path d="M745 133h62m-9 -8 9 8 -9 8"/><path d="M390 183v29m-8 -9 8 9 8 -9"/></g><text x="405" y="208" font-family="Arial,sans-serif" font-size="12" fill="#991b1b">invalid</text></svg>